services:
  # AI-OptiCore is a CLI. Run one-off commands with `docker compose run`:
  #   docker compose run --rm app benchmark --provider openai
  #   docker compose run --rm app config validate
  #   docker compose run --rm app optimize --prompt "hello world"
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-opticore
    # Secrets come from the host environment / a .env file, never from the
    # image or the compose file.
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "ai-opticore", "config", "validate"]
      interval: 60s
      timeout: 5s
      retries: 3

  # Optional local model endpoint (x86_64/arm64 consumers). Launch with:
  #   docker compose up -d ollama
  # then route the CLI provider to it:
  #   docker compose run --rm app benchmark --provider ollama --model <model>
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  ollama_data: