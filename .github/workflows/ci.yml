name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src/ tests/
      - name: Type check (mypy)
        run: mypy src/opticore --ignore-missing-imports
      - name: Tests with coverage gate
        run: pytest --cov=opticore --cov-report=term-missing --cov-fail-under=70 tests/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distribution metadata
        run: twine check dist/*

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: CLI smoke test
        run: |
          ai-opticore init
          ai-opticore config
          ai-opticore config validate
          ai-opticore config --json
          ai-opticore hardware
          ai-opticore models
          ai-opticore optimize --prompt "hello   world"
          ai-opticore benchmark --samples 2 --repeats 1 --provider fake
          ai-opticore cache
          ai-opticore cache stats
          ai-opticore cache stats --json
          python -m opticore --version
          # doctor returns non-zero when Ollama is offline (as in CI); this
          # smoke test asserts the diagnostic runs without crashing.
          ai-opticore doctor --provider ollama --model llama3.2 --no-probe --json || true
      - name: End-to-end example smoke test
        run: |
          python examples/example_aiclient.py

  security:
    runs-on: ubuntu-latest
    # Audit on a supported interpreter: patched requests/urllib3 require
    # Python >=3.10, so a 3.9 audit would fail on vulnerabilities with no
    # upstream fix for that interpreter.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
          pip install pip-audit
      - name: Audit production dependencies for known vulnerabilities
        run: pip-audit
      - name: Scan for leaked secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3